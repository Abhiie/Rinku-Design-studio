<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rinku Design Studio — Luxury Interior Design</title>
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <link rel="apple-touch-icon" href="/favicon.jpg" />
    <meta name="theme-color" content="#0A0A0A" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <!-- Synchronous scroll reset — must run before React mounts -->
    <script>
      // Kill browser scroll restoration so it never restores mid-page position
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }
      // Force top immediately — before any JS module or React runs
      window.scrollTo(0, 0);
      // Strip any hash from URL so browser doesn't auto-scroll to an anchor on refresh
      if (window.location.hash && window.location.hash !== '#home') {
        history.replaceState(null, '', window.location.pathname);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
